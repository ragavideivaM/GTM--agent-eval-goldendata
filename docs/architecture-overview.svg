<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1900" viewBox="0 0 1600 1900" role="img" aria-labelledby="title desc">
  <title id="title">AI at Your Doorstep architecture</title>
  <desc id="desc">A top-to-bottom architecture diagram showing the Streamlit interface, source ingestion, RAG pipeline, Deep Agent workflow, review, human approval, and JSON export.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#001b25" flood-opacity="0.35"/></filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#58a6ff"/></marker>
    <marker id="green-arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#50c878"/></marker>
    <marker id="purple-arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#b18cff"/></marker>
    <style>
      .heading{font:700 42px Inter,Arial,sans-serif;fill:#f4fbff}.sub{font:400 19px Inter,Arial,sans-serif;fill:#a8c5d0}.lane{font:700 14px Inter,Arial,sans-serif;fill:#7fa7b5;letter-spacing:2.3px}.title{font:700 22px Inter,Arial,sans-serif;fill:#152c36}.file{font:600 13px "SFMono-Regular",Consolas,monospace;fill:#64747c}.body{font:400 15px Inter,Arial,sans-serif;fill:#3c5059}.small{font:400 13px Inter,Arial,sans-serif;fill:#687a83}.white-title{font:700 22px Inter,Arial,sans-serif;fill:#fff}.white-body{font:400 15px Inter,Arial,sans-serif;fill:#d8e9ef}.edge{fill:none;stroke-width:4}.card{filter:url(#shadow)}
    </style>
  </defs>

  <rect width="1600" height="1900" fill="#063541"/>
  <rect x="0" y="0" width="1600" height="12" fill="#28a7bd"/>
  <text x="80" y="76" class="heading">AI at Your Doorstep — GTM Agent Architecture</text>
  <text x="80" y="112" class="sub">From approved sources to grounded, reviewed, human-approved content</text>

  <!-- 1. User entry -->
  <text x="80" y="164" class="lane">USER ENTRY AND HUMAN CONTROL</text>
  <g class="card">
    <rect x="80" y="184" width="1440" height="150" rx="20" fill="#edf4ff" stroke="#4e8cff" stroke-width="3"/>
    <text x="112" y="226" class="title">Streamlit UI</text>
    <text x="112" y="253" class="file">app.py</text>
    <text x="112" y="287" class="body">Welcome  •  Generate  •  Full Goto Content  •  Debug</text>
    <text x="112" y="314" class="small">Controls source selection, cost approval, research-brief approval, feedback, final approval, and download.</text>
  </g>
  <path d="M800 334V374" class="edge" stroke="#58a6ff" marker-end="url(#arrow)"/>

  <!-- 2. Sources -->
  <text x="80" y="410" class="lane">SOURCE COLLECTION AND APPROVAL</text>
  <g class="card"><rect x="80" y="430" width="440" height="160" rx="18" fill="#fff8ef" stroke="#f29b52" stroke-width="3"/><text x="110" y="472" class="title">Web discovery</text><text x="110" y="499" class="file">research/web_discovery.py</text><text x="110" y="533" class="body">Searches the last seven days</text><text x="110" y="560" class="body">Returns links, dates, and categories</text></g>
  <g class="card"><rect x="580" y="430" width="440" height="160" rx="18" fill="#fff8ef" stroke="#f29b52" stroke-width="3"/><text x="610" y="472" class="title">Document inputs</text><text x="610" y="499" class="file">ingestion/service.py</text><text x="610" y="533" class="body">Web, pasted text, PDF, and Excel</text><text x="610" y="560" class="body">Creates a common SourceDocument</text></g>
  <g class="card"><rect x="1080" y="430" width="440" height="160" rx="18" fill="#fff8ef" stroke="#f29b52" stroke-width="3"/><text x="1110" y="472" class="title">Source approval gate</text><text x="1110" y="499" class="file">app.py → agents/main_agent.py</text><text x="1110" y="533" class="body">Only approved sources continue</text><text x="1110" y="560" class="body">Indexing requires cost approval</text></g>
  <path d="M520 510H570" class="edge" stroke="#f29b52" marker-end="url(#arrow)"/><path d="M1020 510H1070" class="edge" stroke="#f29b52" marker-end="url(#arrow)"/>
  <path d="M800 590V632" class="edge" stroke="#50c878" marker-end="url(#green-arrow)"/>

  <!-- 3. RAG -->
  <text x="80" y="668" class="lane">RAG INGESTION AND RETRIEVAL</text>
  <g class="card"><rect x="80" y="688" width="330" height="190" rx="18" fill="#edfff3" stroke="#50c878" stroke-width="3"/><text x="108" y="731" class="title">Extract + normalize</text><text x="108" y="758" class="file">ingestion/service.py</text><text x="108" y="794" class="body">Text and metadata</text><text x="108" y="821" class="body">Stable document identity</text></g>
  <g class="card"><rect x="450" y="688" width="330" height="190" rx="18" fill="#edfff3" stroke="#50c878" stroke-width="3"/><text x="478" y="731" class="title">Chunk + embed</text><text x="478" y="758" class="file">chunker.py · embeddings.py</text><text x="478" y="794" class="body">3,600 maximum • 450 overlap</text><text x="478" y="821" class="body">OpenAI embedding vectors</text></g>
  <g class="card"><rect x="820" y="688" width="330" height="190" rx="18" fill="#edfff3" stroke="#50c878" stroke-width="3"/><text x="848" y="731" class="title">Pinecone index</text><text x="848" y="758" class="file">research/pinecone_store.py</text><text x="848" y="794" class="body">Vectors + original text</text><text x="848" y="821" class="body">Evidence IDs and metadata</text></g>
  <g class="card"><rect x="1190" y="688" width="330" height="190" rx="18" fill="#edfff3" stroke="#50c878" stroke-width="3"/><text x="1218" y="731" class="title">Retriever</text><text x="1218" y="758" class="file">research/retrieval.py</text><text x="1218" y="794" class="body">Five editorial queries</text><text x="1218" y="821" class="body">Ranks and returns chunks</text></g>
  <path d="M410 783H440" class="edge" stroke="#50c878" marker-end="url(#green-arrow)"/><path d="M780 783H810" class="edge" stroke="#50c878" marker-end="url(#green-arrow)"/><path d="M1150 783H1180" class="edge" stroke="#50c878" marker-end="url(#green-arrow)"/>
  <path d="M1355 878V920H800V942" class="edge" stroke="#58a6ff" marker-end="url(#arrow)"/>

  <!-- 4. Brief and services -->
  <text x="80" y="974" class="lane">GROUNDED BRIEF AND EXTERNAL SERVICES</text>
  <g class="card"><rect x="80" y="994" width="930" height="170" rx="18" fill="#edf4ff" stroke="#4e8cff" stroke-width="3"/><text x="110" y="1037" class="title">Grounded research brief</text><text x="110" y="1064" class="file">research/brief_builder.py</text><text x="110" y="1100" class="body">Stories, takeaways, links, and claims citing retrieved evidence IDs</text><text x="110" y="1128" class="small">The user reviews and approves this brief before content generation.</text></g>
  <g class="card"><rect x="1050" y="994" width="470" height="170" rx="18" fill="#f8fbfc" stroke="#8ba4ad" stroke-width="3" stroke-dasharray="9 7"/><text x="1080" y="1037" class="title">External services</text><text x="1080" y="1064" class="file">API keys and billing in .env</text><text x="1080" y="1100" class="body">OpenAI: search, embeddings, generation</text><text x="1080" y="1128" class="body">Pinecone: vector storage and retrieval</text></g>
  <path d="M800 1164V1206" class="edge" stroke="#b18cff" marker-end="url(#purple-arrow)"/>

  <!-- 5. Agent loop -->
  <text x="80" y="1242" class="lane">BOUNDED DEEP AGENT GENERATION LOOP</text>
  <g class="card"><rect x="80" y="1262" width="440" height="188" rx="18" fill="#f6f0ff" stroke="#9a73e8" stroke-width="3"/><text x="110" y="1305" class="title">Deep Agent</text><text x="110" y="1332" class="file">agents/deep_runtime.py</text><text x="110" y="1368" class="body">Checks workflow status</text><text x="110" y="1395" class="body">Chooses the next approved tool</text><text x="110" y="1422" class="small">Bounded calls and graph recursion</text></g>
  <g class="card"><rect x="580" y="1262" width="440" height="188" rx="18" fill="#7048bd" stroke="#b18cff" stroke-width="3"/><text x="610" y="1305" class="white-title">Safe coordinator</text><text x="610" y="1332" style="font:600 13px 'SFMono-Regular',Consolas,monospace;fill:#e6dcff">tool_adapters.py · main_agent.py</text><text x="610" y="1368" class="white-body">Checks approvals and call limits</text><text x="610" y="1395" class="white-body">Executes approved operations</text><text x="610" y="1422" style="font:400 13px Inter,Arial,sans-serif;fill:#e6dcff">Provides a deterministic fallback</text></g>
  <g class="card"><rect x="1080" y="1262" width="440" height="188" rx="18" fill="#f6f0ff" stroke="#9a73e8" stroke-width="3"/><text x="1110" y="1305" class="title">Content writer</text><text x="1110" y="1332" class="file">agents/content_writer.py</text><text x="1110" y="1368" class="body">LinkedIn • email • blog • ads</text><text x="1110" y="1395" class="body">Claims cite evidence IDs</text><text x="1110" y="1422" class="small">Validates length and campaign CTA</text></g>
  <path d="M520 1356H570" class="edge" stroke="#b18cff" marker-end="url(#purple-arrow)"/><path d="M1020 1356H1070" class="edge" stroke="#b18cff" marker-end="url(#purple-arrow)"/>
  <path d="M1300 1450V1492" class="edge" stroke="#b18cff" marker-end="url(#purple-arrow)"/>

  <!-- 6. Review -->
  <text x="80" y="1528" class="lane">AUTOMATED REVIEW AND REVISION</text>
  <g class="card"><rect x="80" y="1548" width="690" height="170" rx="18" fill="#f6f0ff" stroke="#9a73e8" stroke-width="3"/><text x="110" y="1591" class="title">Review agent</text><text x="110" y="1618" class="file">agents/reviewer.py</text><text x="110" y="1654" class="body">Checks grounding, consistency, tone, clarity, and CTA</text><text x="110" y="1682" class="small">Reports unsupported claims and produces revised assets.</text></g>
  <g class="card"><rect x="830" y="1548" width="690" height="170" rx="18" fill="#edf4ff" stroke="#4e8cff" stroke-width="3"/><text x="860" y="1591" class="title">Reviewed GTM suite</text><text x="860" y="1618" class="file">models/content.py · evaluations/</text><text x="860" y="1654" class="body">LinkedIn post • promotional email • blog draft • four ads</text><text x="860" y="1682" class="small">Includes review scores, revised content, and evidence references.</text></g>
  <path d="M770 1633H820" class="edge" stroke="#b18cff" marker-end="url(#purple-arrow)"/>
  <path d="M1175 1718V1750" class="edge" stroke="#58a6ff" marker-end="url(#arrow)"/>

  <!-- 7. Delivery -->
  <text x="80" y="1780" class="lane">FINAL HUMAN REVIEW AND DELIVERY</text>
  <g class="card"><rect x="80" y="1800" width="440" height="72" rx="18" fill="#123f4c" stroke="#58a6ff" stroke-width="2"/><text x="110" y="1844" class="white-title">Full Goto Content</text></g>
  <g class="card"><rect x="580" y="1800" width="440" height="72" rx="18" fill="#123f4c" stroke="#58a6ff" stroke-width="2"/><text x="610" y="1844" class="white-title">Feedback + final approval</text></g>
  <g class="card"><rect x="1080" y="1800" width="440" height="72" rx="18" fill="#123f4c" stroke="#58a6ff" stroke-width="2"/><text x="1110" y="1844" class="white-title">JSON export</text></g>
  <path d="M520 1836H570" class="edge" stroke="#58a6ff" marker-end="url(#arrow)"/><path d="M1020 1836H1070" class="edge" stroke="#58a6ff" marker-end="url(#arrow)"/>
</svg>
